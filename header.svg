<svg width="900" height="180" viewBox="0 0 900 180" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Gradiente principal: azul oscuro → azul → blanco -->
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B1F3A"/>
      <stop offset="55%" stop-color="#2F6BFF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Gradiente secundario -->
    <linearGradient id="subtitleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A3557"/>
      <stop offset="60%" stop-color="#6B9CFF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Sombra sutil -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4"
                    flood-color="#0B1F3A"
                    flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Título -->
  <text
    x="450"
    y="75"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="42"
    font-weight="700"
    letter-spacing="1"
    fill="url(#titleGradient)"
    filter="url(#shadow)">
    BUSINESS → DATA → AI → PRODUCT
  </text>

  <!-- Subtítulo -->
  <text
    x="450"
    y="120"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="20"
    font-weight="600"
    letter-spacing="3"
    fill="url(#subtitleGradient)">
    LEARN · BUILD · DEPLOY
  </text>

</svg>